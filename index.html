<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VIRGULE</title>
<style>
  :root {
    --neon: #4df3ff;
    --hot: #ff3d81;
    --bg: #05060c;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: #e8f6ff;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    /* Coupe tous les gestes natifs : zoom double-tap, scroll élastique, sélection. */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* Sonde lue par le JS pour connaître les encoches en pixels CSS. */
  #safe-probe {
    position: fixed;
    top: 0; left: 0;
    width: 0; height: 0;
    padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
    pointer-events: none;
    visibility: hidden;
  }

  /* Coupe-son, dans le coin : le chrono a été recentré pour lui laisser
     la place, et la cible reste assez petite pour ne pas gêner la visée. */
  #sound {
    position: fixed;
    top: calc(var(--safe-t) + 10px);
    right: calc(var(--safe-r) + 12px);
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid rgba(232,246,255,.14);
    border-radius: 50%;
    background: rgba(8,12,24,.6);
    color: rgba(232,246,255,.6);
    box-shadow: none;
    touch-action: manipulation;
    transition: color .15s ease, border-color .15s ease;
  }
  #sound.on { color: var(--neon); border-color: rgba(77,243,255,.4); }
  #sound:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }

  /* Barre d'armes : en bas, loin du pouce qui vise. La barre elle-même
     laisse passer les touchers, seuls les boutons les captent. */
  #weapons {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    /* Six pastilles nommées ne tiennent pas toujours sur une ligne étroite :
       on passe à la ligne plutôt que de déborder de l'écran. */
    flex-wrap: wrap;
    gap: 5px;
    padding: 10px calc(var(--safe-r) + 10px) calc(var(--safe-b) + 12px) calc(var(--safe-l) + 10px);
    pointer-events: none;
  }
  #weapons[hidden] { display: none; }

  /* Purement indicatif depuis que les armes se cumulent : rien n'intercepte
     le toucher, la bande basse reste jouable. */
  .wpn {
    pointer-events: none;
    position: relative;
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    flex: 0 0 auto;
    border: 1px solid rgba(232,246,255,.14);
    border-radius: 12px;
    background: rgba(8,12,24,.74);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    color: rgba(232,246,255,.62);
    overflow: hidden;
    box-shadow: none;
    transition: border-color .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .wpn svg { display: block; position: relative; z-index: 1; }
  .wpn .glyph { color: currentColor; }

  /* Une arme en service s'allume à sa couleur. */
  .wpn.active {
    color: var(--w);
    border-color: var(--w);
    box-shadow: 0 0 18px var(--w-dim), inset 0 0 14px var(--w-dim);
  }

  /* Verrouillée : pointillés, icône éteinte, et une jauge qui monte du bas
     au rythme du score — le palier reste lisible sans un seul chiffre. */
  .wpn:not(.active) {
    color: rgba(232,246,255,.26);
    border-style: dashed;
    border-color: rgba(232,246,255,.12);
  }
  .wpn:not(.active) .glyph { opacity: .45; }
  .wpn:not(.active)::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: calc(var(--p, 0) * 100%);
    background: var(--w-dim);
    transition: height .3s linear;
  }

  /* Annonce de déblocage */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-b) + 92px);
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 11px 20px;
    border: 1px solid var(--t);
    border-radius: 999px;
    background: rgba(8,12,24,.9);
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
  }
  #toast[hidden] { display: none; }
  #toast .t-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--t);
  }
  #toast .t-sub {
    font-size: 11px;
    color: rgba(232,246,255,.6);
    letter-spacing: .02em;
    text-transform: none;
  }
  #toast.show { animation: toast 2.6s ease forwards; }
  @keyframes toast {
    0%   { opacity: 0; transform: translateX(-50%) translateY(10px) scale(.94); }
    9%   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    78%  { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-6px) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    #toast.show { animation-duration: 2.6s; }
    #toast.show { animation-name: toast-fade; }
    @keyframes toast-fade {
      0%, 100% { opacity: 0; transform: translateX(-50%); }
      9%, 78%  { opacity: 1; transform: translateX(-50%); }
    }
    .panel { animation: none; }
  }

  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(var(--safe-t) + 20px) calc(var(--safe-r) + 20px)
             calc(var(--safe-b) + 20px) calc(var(--safe-l) + 20px);
    background: radial-gradient(circle at 50% 45%, rgba(8,12,26,.72), rgba(3,4,10,.94));
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  #overlay[hidden] { display: none; }

  .panel {
    width: min(420px, 100%);
    text-align: center;
    animation: rise .28s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  .title {
    font-size: clamp(34px, 12vw, 76px);
    font-weight: 800;
    letter-spacing: .1em;
    line-height: 1;
    margin-bottom: 6px;
    color: #fff;
    text-shadow: 0 0 12px var(--neon), 0 0 38px rgba(77,243,255,.55);
  }
  .subtitle {
    font-size: 13px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: rgba(232,246,255,.5);
    margin-bottom: 34px;
  }

  .hint {
    font-size: 15px;
    line-height: 1.6;
    color: rgba(232,246,255,.78);
    margin-bottom: 30px;
  }
  .hint b { color: var(--neon); font-weight: 600; }

  .scores {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 32px;
  }
  .score-block .label {
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(232,246,255,.45);
    margin-bottom: 4px;
  }
  .score-block .value {
    font-size: 34px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #fff;
  }
  .score-block.best .value { color: var(--neon); }
  .score-block .value.new-best { color: var(--hot); text-shadow: 0 0 18px rgba(255,61,129,.7); }

  /* Sélecteur de visée */
  .seg-label {
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(232,246,255,.45);
    margin-bottom: 10px;
  }
  .seg {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 26px;
  }
  .seg button {
    flex: 1 1 0;
    max-width: 170px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 11px 12px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: none;
    color: rgba(232,246,255,.6);
    background: rgba(8,12,24,.6);
    border: 1px solid rgba(232,246,255,.14);
    border-radius: 13px;
    box-shadow: none;
  }
  .seg button .hint-sm {
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0;
    color: rgba(232,246,255,.4);
    line-height: 1.35;
  }
  .seg button[aria-pressed="true"] {
    color: var(--neon);
    border-color: var(--neon);
    box-shadow: 0 0 16px rgba(77,243,255,.22);
  }
  .seg button[aria-pressed="true"] .hint-sm { color: rgba(232,246,255,.62); }

  .stats {
    font-size: 13px;
    color: rgba(232,246,255,.5);
    margin-bottom: 28px;
    font-variant-numeric: tabular-nums;
  }

  button {
    -webkit-appearance: none;
    appearance: none;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--neon);
    border: 0;
    border-radius: 999px;
    padding: 17px 46px;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 0 30px rgba(77,243,255,.45);
    transition: transform .1s ease, box-shadow .2s ease;
  }
  button:active { transform: scale(.96); box-shadow: 0 0 14px rgba(77,243,255,.3); }

  .gameover .title { color: var(--hot); text-shadow: 0 0 12px var(--hot), 0 0 38px rgba(255,61,129,.5); }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="safe-probe"></div>

  <button type="button" id="sound" aria-pressed="true"></button>
  <div id="weapons" hidden></div>
  <div id="toast" hidden></div>

  <div id="overlay">
    <div class="panel" id="panel"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
